<!DOCTYPE html>
<!-- HUD TODO — v16.0 — 2026-10-12 -->
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HUD Task Manager v16.0</title>
<link rel="icon" type="image/x-icon" href="HUD.ico" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#00f5ff" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<link rel="stylesheet" href="hud_todo.css" />
</head>
<body>

<div class="hud-todo-modal-overlay" id="ht-modal">
  <div class="hud-todo-modal">
    <div class="hud-todo-modal-title">◈ Nouvelle catégorie</div>
    <input class="hud-todo-modal-input" id="ht-cat-inp" type="text" placeholder="◌ Nom de la catégorie..." />
    <div class="hud-todo-modal-actions">
      <button class="hud-todo-modal-cancel" onclick="closeModal()">Annuler</button>
      <button class="hud-todo-btn hud-todo-btn-modal" onclick="confirmAddCategory()">▶ Créer</button>
    </div>
  </div>
</div>

<div class="hud-todo-wrap">
  <div class="hud-todo-scanline"></div>
  <div class="hud-todo-corner-tl"></div>
  <div class="hud-todo-corner-br"></div>

  <div class="hud-todo-header">
    <div>
      <div class="hud-todo-title">◈ Tactical Task Manager</div>
      <div class="hud-todo-id"><span class="hud-todo-status-dot"></span>SYS.ONLINE — OPR.AUTHENTICATED</div>
    </div>
    <div class="hud-todo-header-right">
      <button class="hud-todo-login-btn" id="ht-login-btn" onclick="signIn()">⬡ Sign in</button>
      <div class="hud-todo-id"><span class="hud-todo-sync-dot" id="ht-sync-dot"></span><span id="ht-sync-label">CONNECTING...</span></div>
      <div class="hud-todo-id" id="ht-clock">00:00:00</div>
    </div>
  </div>

  <div class="hud-todo-stats-row">
    <div class="hud-todo-stat-box"><div class="hud-todo-stat-n" id="ht-total">0</div><div class="hud-todo-stat-l">Missions</div></div>
    <div class="hud-todo-stat-box"><div class="hud-todo-stat-n" id="ht-done">0</div><div class="hud-todo-stat-l">Exécutées</div></div>
    <div class="hud-todo-stat-box"><div class="hud-todo-stat-n" id="ht-remain">0</div><div class="hud-todo-stat-l">En attente</div></div>
  </div>

  <div class="hud-todo-progress-wrap"><div class="hud-todo-progress-bar" id="ht-progress"></div></div>
  <div class="hud-todo-progress-label" id="ht-progress-label">COMPLETION — 0%</div>

  <div class="hud-todo-tabs">
    <button class="hud-todo-tab active" id="ht-tab-active" onclick="switchTab('active')">◈ Tactical Task Manager</button>
    <button class="hud-todo-tab" id="ht-tab-done" onclick="switchTab('done')">◈ Tasks Completed</button>
  </div>

  <!-- Panel: active tasks -->
  <div class="hud-todo-panel active" id="ht-panel-active">
    <div class="hud-todo-input-zone">
      <input class="hud-todo-input" id="ht-inp" type="text" placeholder="◌ Entrer directive..." />
      <select class="hud-todo-cat-select" id="ht-cat-sel"></select>
      <div class="hud-todo-sphere-pick">
        <div class="hud-todo-sphere s-low active"  id="ht-sp-low"  onclick="selectPrio('low')"  title="Basse"></div>
        <div class="hud-todo-sphere s-med"          id="ht-sp-med"  onclick="selectPrio('med')"  title="Normale"></div>
        <div class="hud-todo-sphere s-high"         id="ht-sp-high" onclick="selectPrio('high')" title="Haute"></div>
      </div>
      <button class="hud-todo-btn" onclick="addTask()">▶ EXEC</button>
    </div>

    <button class="hud-todo-btn-cat" onclick="openModal()">+ Add category</button>

    <div class="hud-todo-filter-bar" id="ht-filters">
      <span class="hud-todo-filter-label">Filtres</span>
      <button class="hud-todo-filter-btn active" data-cat="all" onclick="setCatFilter('all')">Toutes catégories</button>
      <div id="ht-cat-filters"></div>
    </div>

    <div class="hud-todo-section-label">Directives actives</div>
    <div id="ht-list"></div>
  </div>

  <!-- Panel: completed tasks -->
  <div class="hud-todo-panel" id="ht-panel-done">
    <div class="hud-todo-section-label">Directives accomplies</div>
    <div id="ht-list-done"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
  import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqg5N12AUBXn9ZEzfPSw6pcBwPABqq6jw",
    authDomain: "hud-todo.firebaseapp.com",
    projectId: "hud-todo",
    storageBucket: "hud-todo.firebasestorage.app",
    messagingSenderId: "265738110346",
    appId: "1:265738110346:web:faae50b708bc5fc4303473"
  };

  const app      = initializeApp(firebaseConfig);
  const db       = getFirestore(app);
  const auth     = getAuth(app);
  const provider = new GoogleAuthProvider();

  let tasks       = [];
  let categories  = [];
  let currentTab  = 'active';
  let currentPrio = 'low';
  let filterCat   = 'all';

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('ht-tab-active').classList.toggle('active', tab === 'active');
    document.getElementById('ht-tab-done').classList.toggle('active', tab === 'done');
    document.getElementById('ht-panel-active').classList.toggle('active', tab === 'active');
    document.getElementById('ht-panel-done').classList.toggle('active', tab === 'done');
  }
  window.switchTab = switchTab;

  // Sync indicator
  function setSync(state, label) {
    const dot = document.getElementById('ht-sync-dot');
    const lbl = document.getElementById('ht-sync-label');
    dot.className = 'hud-todo-sync-dot ' + state;
    lbl.textContent = label;
  }

  // Clock
  function updateClock() {
    const n = new Date();
    const pad = v => String(v).padStart(2,'0');
    document.getElementById('ht-clock').textContent =
      pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Priority
  function selectPrio(p) {
    currentPrio = p;
    ['high','med','low'].forEach(x => {
      document.getElementById('ht-sp-' + x).className = 'hud-todo-sphere s-' + x + (x === p ? ' active' : '');
    });
  }
  window.selectPrio = selectPrio;

  // Modal
  function openModal() {
    document.getElementById('ht-modal').classList.add('open');
    setTimeout(() => document.getElementById('ht-cat-inp').focus(), 50);
  }
  function closeModal() {
    document.getElementById('ht-modal').classList.remove('open');
    document.getElementById('ht-cat-inp').value = '';
  }
  async function confirmAddCategory() {
    const name = document.getElementById('ht-cat-inp').value.trim();
    if (!name) return;
    if (categories.find(c => c.name.toLowerCase() === name.toLowerCase())) { closeModal(); return; }
    setSync('syncing', 'WRITING...');
    try {
      await addDoc(collection(db, 'categories'), { name, order: Date.now() });
      setSync('synced', 'SYNCED');
    } catch(e) { setSync('error', 'ERROR'); }
    closeModal();
  }
  document.getElementById('ht-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  document.getElementById('ht-cat-inp').addEventListener('keydown', e => { if (e.key === 'Enter') confirmAddCategory(); if (e.key === 'Escape') closeModal(); });
  window.openModal = openModal;
  window.closeModal = closeModal;
  window.confirmAddCategory = confirmAddCategory;

  // Filters
  function setCatFilter(c) {
    filterCat = c;
    document.querySelectorAll('[data-cat]').forEach(b => b.classList.toggle('active', b.dataset.cat === c));
    render();
  }
  window.setCatFilter = setCatFilter;

  function getFilteredTasks() {
    return tasks.filter(t => filterCat === 'all' || t.cat === filterCat);
  }

  // Category select + filter buttons
  function renderCatSelect() {
    const sel = document.getElementById('ht-cat-sel');
    const prev = sel.value;
    sel.innerHTML = '<option value="">— Catégorie —</option>' +
      categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    if (prev) sel.value = prev;

    document.getElementById('ht-cat-filters').innerHTML = categories.map(c =>
      `<button class="hud-todo-filter-btn${filterCat === c.id ? ' active' : ''}" data-cat="${c.id}" onclick="setCatFilter('${c.id}')">${c.name}</button>`
    ).join('');
  }

  async function delCategory(id) {
    setSync('syncing', 'WRITING...');
    try {
      await deleteDoc(doc(db, 'categories', id));
      const toUpdate = tasks.filter(t => t.cat === id);
      for (const t of toUpdate) await updateDoc(doc(db, 'tasks', t.id), { cat: '' });
      if (filterCat === id) { filterCat = 'all'; document.querySelectorAll('[data-cat]').forEach(b => b.classList.toggle('active', b.dataset.cat === 'all')); }
      setSync('synced', 'SYNCED');
    } catch(e) { setSync('error', 'ERROR'); }
  }
  window.delCategory = delCategory;

  // Tasks
  async function addTask() {
    const inp  = document.getElementById('ht-inp');
    const text = inp.value.trim();
    if (!text) return;
    const catId = document.getElementById('ht-cat-sel').value;
    setSync('syncing', 'WRITING...');
    try {
      await addDoc(collection(db, 'tasks'), {
        text,
        prio: currentPrio,
        done: false,
        cat: catId,
        createdAt: Date.now()
      });
      inp.value = '';
      setSync('synced', 'SYNCED');
    } catch(e) { setSync('error', 'ERROR'); }
  }
  window.addTask = addTask;

  async function toggle(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    setSync('syncing', 'WRITING...');
    try {
      await updateDoc(doc(db, 'tasks', id), { done: !t.done });
      setSync('synced', 'SYNCED');
    } catch(e) { setSync('error', 'ERROR'); }
  }
  window.toggle = toggle;

  async function editTask(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    const newText = prompt('Modifier la tâche :', t.text);
    if (!newText || newText.trim() === t.text) return;
    setSync('syncing', 'WRITING...');
    try {
      await updateDoc(doc(db, 'tasks', id), { text: newText.trim() });
      setSync('synced', 'SYNCED');
    } catch(e) { setSync('error', 'ERROR'); }
  }
  window.editTask = editTask;

  async function editCategory(id) {
    const cat = categories.find(c => c.id === id);
    if (!cat) return;
    const newName = prompt('Modifier la catégorie :', cat.name);
    if (!newName || newName.trim() === cat.name) return;
    setSync('syncing', 'WRITING...');
    try {
      await updateDoc(doc(db, 'categories', id), { name: newName.trim() });
      setSync('synced', 'SYNCED');
    } catch(e) { setSync('error', 'ERROR'); }
  }
  window.editCategory = editCategory;

  async function del(id) {
    setSync('syncing', 'WRITING...');
    try {
      await deleteDoc(doc(db, 'tasks', id));
      setSync('synced', 'SYNCED');
    } catch(e) { setSync('error', 'ERROR'); }
  }
  window.del = del;

  function makeTaskEl(t) {
    const div = document.createElement('div');
    div.className = `hud-todo-task-item prio-${t.prio}${t.done ? ' done' : ''}`;
    div.dataset.id = t.id;
    div.innerHTML = `
      <span class="hud-todo-drag-handle" title="Déplacer">⠿</span>
      <input class="hud-todo-check" type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle('${t.id}')" />
      <div class="hud-todo-task-sphere ${t.prio}"></div>
      <span class="hud-todo-task-text">${t.text}</span>
      <button class="hud-todo-edit-btn" onclick="editTask('${t.id}')" title="Modifier">✎</button>
      <button class="hud-todo-del-btn" onclick="del('${t.id}')">✕</button>`;
    return div;
  }

  function makeCatBlock(cat, taskList, showDel) {
    const catTasks = taskList.filter(t => t.cat === cat.id);
    if (!catTasks.length) return null;

    const block = document.createElement('div');
    block.className = 'hud-todo-cat-block';
    block.dataset.id = cat.id;

    const header = document.createElement('div');
    header.className = 'hud-todo-cat-header';
    header.innerHTML = `
      ${showDel ? '<span class="hud-todo-cat-drag" title="Déplacer bloc">⠿</span>' : ''}
      <span class="hud-todo-cat-name">◈ ${cat.name}</span>
      ${showDel ? `<button class="hud-todo-edit-btn" onclick="editCategory('${cat.id}')" title="Modifier">✎</button><button class="hud-todo-cat-del" onclick="delCategory('${cat.id}')">✕ suppr.</button>` : ''}`;

    const list = document.createElement('div');
    list.className = 'hud-todo-task-list';
    catTasks.forEach(t => list.appendChild(makeTaskEl(t)));

    block.appendChild(header);
    block.appendChild(list);

    if (showDel) {
      Sortable.create(list, {
        animation: 150,
        handle: '.hud-todo-drag-handle',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        onEnd: async (evt) => {
          const ids = [...evt.to.children].map(el => el.dataset.id);
          setSync('syncing', 'WRITING...');
          try {
            const batch = ids.map((id, i) => updateDoc(doc(db, 'tasks', id), { order: i }));
            await Promise.all(batch);
            setSync('synced', 'SYNCED');
          } catch(e) { setSync('error', 'ERROR'); }
        }
      });
    }
    return block;
  }

  function makeUncatBlock(taskList, showDel) {
    const uncatTasks = taskList.filter(t => !t.cat || t.cat === '');
    if (!uncatTasks.length) return null;

    const block = document.createElement('div');
    block.className = 'hud-todo-cat-block';
    block.dataset.id = '__uncat__';

    const header = document.createElement('div');
    header.className = 'hud-todo-cat-header';
    header.innerHTML = `<span class="hud-todo-cat-name uncat">◌ Sans catégorie</span>`;

    const list = document.createElement('div');
    list.className = 'hud-todo-task-list';
    uncatTasks.forEach(t => list.appendChild(makeTaskEl(t)));

    block.appendChild(header);
    block.appendChild(list);

    if (showDel) {
      Sortable.create(list, {
        animation: 150,
        handle: '.hud-todo-drag-handle',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        onEnd: async (evt) => {
          const ids = [...evt.to.children].map(el => el.dataset.id);
          setSync('syncing', 'WRITING...');
          try {
            const batch = ids.map((id, i) => updateDoc(doc(db, 'tasks', id), { order: i }));
            await Promise.all(batch);
            setSync('synced', 'SYNCED');
          } catch(e) { setSync('error', 'ERROR'); }
        }
      });
    }
    return block;
  }

  function render() {
    const activeTasks = tasks.filter(t => !t.done)
      .sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));
    const doneTasks = tasks.filter(t => t.done)
      .sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));
    const filtered = activeTasks.filter(t => filterCat === 'all' || t.cat === filterCat);
    const pct = tasks.length ? Math.round(doneTasks.length / tasks.length * 100) : 0;

    document.getElementById('ht-total').textContent  = tasks.length;
    document.getElementById('ht-done').textContent   = doneTasks.length;
    document.getElementById('ht-remain').textContent = activeTasks.length;
    document.getElementById('ht-progress').style.width = pct + '%';
    document.getElementById('ht-progress-label').textContent = 'COMPLETION — ' + pct + '%';

    // Active panel
    const list = document.getElementById('ht-list');
    list.innerHTML = '';
    if (!filtered.length) {
      list.innerHTML = '<div class="hud-todo-empty-state">Aucune directive en cours</div>';
    } else {
      categories.forEach(cat => {
        const block = makeCatBlock(cat, filtered, true);
        if (block) list.appendChild(block);
      });
      const uncat = makeUncatBlock(filtered, true);
      if (uncat) list.appendChild(uncat);

      Sortable.create(list, {
        animation: 150,
        handle: '.hud-todo-cat-drag',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        onEnd: async (evt) => {
          const ids = [...evt.to.children].map(el => el.dataset.id).filter(id => id !== '__uncat__');
          setSync('syncing', 'WRITING...');
          try {
            const batch = ids.map((id, i) => updateDoc(doc(db, 'categories', id), { order: i }));
            await Promise.all(batch);
            setSync('synced', 'SYNCED');
          } catch(e) { setSync('error', 'ERROR'); }
        }
      });
    }

    // Completed panel
    const listDone = document.getElementById('ht-list-done');
    listDone.innerHTML = '';
    if (!doneTasks.length) {
      listDone.innerHTML = '<div class="hud-todo-empty-state">Aucune directive accomplie</div>';
    } else {
      categories.forEach(cat => {
        const block = makeCatBlock(cat, doneTasks, false);
        if (block) listDone.appendChild(block);
      });
      const uncat = makeUncatBlock(doneTasks, false);
      if (uncat) listDone.appendChild(uncat);
    }
  }

  // Auth + realtime listeners
  let unsubCats  = null;
  let unsubTasks = null;

  async function signIn() {
    try { await signInWithPopup(auth, provider); } catch(e) { setSync('error', 'AUTH ERROR'); }
  }
  window.signIn = signIn;

  onAuthStateChanged(auth, user => {
    if (user) {
      setSync('synced', 'SYNCED — ' + user.email.split('@')[0].toUpperCase());

      if (unsubCats)  unsubCats();
      if (unsubTasks) unsubTasks();

      unsubCats = onSnapshot(collection(db, 'categories'), snap => {
        categories = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (a.order || 0) - (b.order || 0));
        renderCatSelect();
        render();
      }, () => setSync('error', 'ERROR'));

      unsubTasks = onSnapshot(collection(db, 'tasks'), snap => {
        tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));
        render();
      }, () => setSync('error', 'ERROR'));

      document.getElementById('ht-login-btn').classList.remove('visible');
    } else {
      setSync('error', 'NON CONNECTÉ');
      document.getElementById('ht-login-btn').classList.add('visible');
      if (unsubCats)  { unsubCats();  unsubCats  = null; }
      if (unsubTasks) { unsubTasks(); unsubTasks = null; }
    }
  });

  document.getElementById('ht-inp').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  // Register service worker for PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/hud-todo/sw.js').catch(() => {});
  }
</script>
</body>
</html>
